[package]
name = "golden-agent"
version = "0.1.5"
edition.workspace = true
authors.workspace = true
description = "An annotation-driven agent engineering framework for Rust"
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-core.workspace = true
futures-util.workspace = true
bytes.workspace = true
async-trait.workspace = true
async-stream.workspace = true
inventory.workspace = true
golden-macros = { path = "../golden-macros", features = ["agent"] }
sqlx = { workspace = true, optional = true}
uuid.workspace = true

[features]
default = []
persistence-sqlite = ["dep:sqlx", "sqlx/sqlite"]
persistence-mysql = ["dep:sqlx", "sqlx/mysql"]
persistence-postgres = ["dep:sqlx", "sqlx/postgres"]

[[example]]
name = "agent"
path = "examples/agent.rs"

[[example]]
name = "return_direct"
path = "examples/return_direct.rs"

[[example]]
name = "agent_stream"
path = "examples/agent_stream.rs"

[[example]]
name = "dynamic_prompt"
path = "examples/dynamic_prompt.rs"

[[example]]
name = "chat_completion"
path = "examples/chat_completion.rs"

[[example]]
name = "chat_stream"
path = "examples/chat_stream.rs"

[[example]]
name = "tools"
path = "examples/tools.rs"

[[example]]
name = "structured_output"
path = "examples/structured_output.rs"

[[example]]
name = "agent_with_in_memory_checkpointer"
path = "examples/agent_with_in_memory_checkpointer.rs"

[[example]]
name = "agent_with_sqlite_checkpointer"
path = "examples/agent_with_sqlite_checkpointer.rs"
